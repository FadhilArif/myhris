<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MyHRIS — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sidebar:#142E28;--sidebar-hover:#1D4437;--sidebar-active:#2A6B52;--accent:#2F8F63;--bg:#F7F6F1;--surface:#fff;--border:#E5E2D6;--text:#1C2321;--muted:#6E766F;--warning:#B8842E;--danger:#B3402F;--success:#2F8F63}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}.layout{display:flex;height:100vh;overflow:hidden}.sidebar{width:235px;flex-shrink:0;background:var(--sidebar);color:#eee;display:flex;flex-direction:column;height:100vh;padding:18px 12px}.brand{display:flex;align-items:center;gap:10px;padding:5px 10px 16px}.brand-mark{width:31px;height:31px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:#0e241e}.brand-name{font-family:Manrope;font-weight:800}.demo-badge{font-size:9px;background:#d8a84e;color:#2c2110;padding:3px 6px;border-radius:5px;margin-left:auto}.nav{overflow:auto;flex:1}.group{margin:8px 0 12px}.label{font-size:10px;color:#91a298;padding:5px 10px}.item{display:flex;align-items:center;gap:9px;color:#d4dbd6;padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer}.item:hover,.item.active{background:var(--sidebar-active);color:#fff}.sidebar-footer{border-top:1px solid #29473e;padding:12px 8px 0}.role-select{width:100%;background:#1d4437;border:1px solid #386154;color:white;border-radius:7px;padding:7px}.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}.topbar{height:61px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.title{font:700 19px Manrope}.demo-note{font-size:11px;color:#7a6124;background:#fff6dd;border:1px solid #eed8a3;border-radius:7px;padding:6px 9px}.content{padding:22px 26px 50px;overflow:auto;flex:1}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:17px}.stat{font:800 25px Manrope}.muted{font-size:12px;color:var(--muted)}.section-title{font:700 16px Manrope;margin:0 0 12px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:9px;background:#fff}table{width:100%;border-collapse:collapse;font-size:12.5px}th{padding:10px;text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}td{padding:10px;border-bottom:1px solid #eee;white-space:nowrap}tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:4px 7px;border-radius:99px;font-size:10px;font-weight:700}.green{background:#e9f5ee;color:#2f7b57}.yellow{background:#fbf1de;color:#9b6b1d}.red{background:#fbeae6;color:#a33e30}.blue{background:#e9f0fb;color:#37679f}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:8px 12px;font-weight:700;font-size:11px;cursor:pointer}.primary{background:var(--accent);color:#fff}.outline{background:#fff;border:1px solid var(--border)}input,select{border:1px solid var(--border);border-radius:7px;padding:8px 10px;background:#fff}.chart{height:170px;display:flex;align-items:flex-end;gap:9px;padding:15px 5px}.bar{flex:1;background:#6aa886;border-radius:5px 5px 0 0;min-width:18px;position:relative}.bar span{position:absolute;top:-17px;font-size:9px;color:var(--muted);width:100%;text-align:center}.progress{height:7px;background:#eee;border-radius:9px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent)}.empty{padding:35px;text-align:center;color:var(--muted)}.hero{background:linear-gradient(135deg,#17392f,#2f8f63);color:#fff;border-radius:12px;padding:22px;margin-bottom:15px}.hero h1{font:800 25px Manrope;margin:0 0 6px}.hero p{margin:0;color:#dcece5;font-size:13px}.kpi{display:flex;justify-content:space-between;align-items:center}.avatar{width:30px;height:30px;border-radius:50%;background:#dceee5;color:#236047;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}.employee{display:flex;align-items:center;gap:9px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:10}.modal.show{display:flex}.modal-box{background:white;border-radius:12px;width:min(650px,92vw);max-height:85vh;overflow:auto;padding:20px}.close{float:right;cursor:pointer;font-size:20px}@media(max-width:900px){.sidebar{width:70px;padding:12px 7px}.brand-name,.demo-badge,.label,.item span,.sidebar-footer{display:none}.brand{justify-content:center}.item{justify-content:center}.grid4,.grid2{grid-template-columns:1fr 1fr}.content{padding:15px}.topbar{padding:0 15px}}@media(max-width:600px){.grid4,.grid2{grid-template-columns:1fr}.demo-note{display:none}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
 <div class="brand"><div class="brand-mark">M</div><div class="brand-name">MyHRIS</div><div class="demo-badge">DEMO</div></div>
 <nav id="nav" class="nav"></nav>
 <div class="sidebar-footer"><select id="role" class="role-select" onchange="setRole(this.value)"><option value="admin">Demo: Admin</option><option value="hr">Demo: HR</option><option value="manager">Demo: Manager</option><option value="employee">Demo: Employee</option></select></div>
</aside>
<main class="main">
 <header class="topbar"><div class="title" id="title">Dashboard</div><div class="demo-note">MODE DEMO — tidak terhubung ke Supabase</div></header>
 <section id="content" class="content"></section>
</main>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="modalBox" class="modal-box"></div></div>
<script type="module" src="../src/demo/demo.js"></script>
</body>
</html>
