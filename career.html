<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karir — My HRIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --accent:#2F8F63; --accent-dark:#256F4D; --bg:#F7F6F1; --surface:#FFFFFF; --border:#E5E2D6;
    --text:#1C2321; --text-muted:#6E766F; --topbar:#142E28;
    --warning:#B8842E; --warning-bg:#FBF1DE; --danger:#B3402F; --danger-bg:#FBEAE6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Manrope',sans-serif;margin:0;}
  .topbar{background:var(--topbar);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .brand{font-family:'Manrope';font-weight:800;font-size:17px;display:flex;align-items:center;gap:9px;}
  .brand-mark{width:28px;height:28px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:#0E241E;}
  .wrap{max-width:820px;margin:0 auto;padding:30px 20px 70px;}
  .hero{margin-bottom:22px;}
  .hero h1{font-size:23px;margin-bottom:6px;}
  .hero p{color:var(--text-muted);font-size:14px;margin:0;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:14px;}
  .job-card{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .job-title{font-weight:700;font-size:15.5px;}
  .job-dept{color:var(--text-muted);font-size:12.5px;margin-top:2px;}
  .job-desc{font-size:13px;color:var(--text);margin-top:8px;line-height:1.5;}
  .badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .badge-applied{background:var(--warning-bg);color:var(--warning);}
  .badge-stage{background:#EFEDE3;color:#6E766F;}
  .btn{font-family:'Inter';font-weight:600;font-size:13px;padding:8px 14px;border-radius:7px;border:1px solid transparent;cursor:pointer;white-space:nowrap;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-outline{background:transparent;border-color:var(--border);color:var(--text);}
  .btn-ghost{background:transparent;border-color:#33544a;color:#fff;}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  input,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-family:'Inter';font-size:13.5px;margin-top:4px;outline:none;}
  input:focus,textarea:focus{border-color:var(--accent);}
  label{font-size:12.5px;font-weight:600;color:var(--text-muted);}
  .field{margin-bottom:13px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,30,27,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:12px;padding:22px;width:380px;max-width:100%;}
  .empty-state{text-align:center;color:var(--text-muted);padding:26px 10px;font-size:13.5px;}
  .error-text{background:var(--danger-bg);color:var(--danger);font-size:13px;padding:9px 12px;border-radius:7px;margin-bottom:10px;display:none;}
  .toast{position:fixed;bottom:20px;right:20px;background:#1C2321;color:#fff;padding:11px 16px;border-radius:8px;font-size:13.5px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.2);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:10px;font-size:11.5px;text-transform:uppercase;color:var(--text-muted);}
  td{padding:10px;border-top:1px solid var(--border);}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-mark">H</div>Karir — FA TECH</div>
  <div id="topbar-actions"></div>
</div>

<div class="wrap">
  <div class="hero">
    <h1>Lowongan yang Tersedia</h1>
    <p>Temukan posisi yang cocok untukmu dan ajukan lamaran langsung dari halaman ini.</p>
  </div>
  <div id="jobs-area"><div class="empty-state">Memuat lowongan…</div></div>
  <div id="myapps-area"></div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
// =====================================================================
// Pakai project Supabase yang SAMA dengan aplikasi HRIS internal.
// =====================================================================
const SUPABASE_URL = "https://viawltcutsvaawvjqgsk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpYXdsdGN1dHN2YWF3dmpxZ3NrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NjUwODQsImV4cCI6MjEwNTQ0MTA4NH0.hhpVS35YUbadEGagHG7aA7A5DFxlrd4VOZz7mxO0dJo";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let SESSION = null, CPROFILE = null, JOBS = [], MY_APPS = [];

function el(id){ return document.getElementById(id); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(d){ if(!d) return '-'; return new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function showToast(msg, isError){
  const t = document.createElement('div'); t.className = 'toast';
  if(isError) t.style.background = '#B3402F';
  t.textContent = msg; el('toast-root').appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
function openModal(html){ el('modal-root').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ el('modal-root').innerHTML = ''; }

const STAGE_LABEL = { applied:'Melamar', screening:'Screening', interview:'Interview', offer:'Penawaran', hired:'Diterima', rejected:'Tidak Lolos' };

let initialLoadDone = false;
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  SESSION = session;
  await loadAll();
  initialLoadDone = true;
  sb.auth.onAuthStateChange((_event, s)=>{
    if(!initialLoadDone) return; // hindari double-load saat pertama kali buka halaman
    SESSION = s;
    loadAll();
  });
}

async function loadAll(){
  renderTopbar();
  const { data: jobs, error: jobsErr } = await sb.from('job_postings').select('*, departments(name)').eq('status','open').order('opened_date', { ascending:false });
  if(jobsErr){ el('jobs-area').innerHTML = `<div class="empty-state">Gagal memuat lowongan: ${escapeHtml(jobsErr.message)}</div>`; return; }
  JOBS = jobs || [];

  if(SESSION){
    const { data: prof } = await sb.from('candidate_profiles').select('*').eq('id', SESSION.user.id).maybeSingle();
    CPROFILE = prof || null;
    const { data: apps } = await sb.from('candidates').select('*, job_postings(title)').eq('applicant_id', SESSION.user.id);
    MY_APPS = apps || [];
  } else {
    CPROFILE = null; MY_APPS = [];
  }
  renderJobs();
  renderMyApps();
}

function renderTopbar(){
  if(SESSION){
    el('topbar-actions').innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;font-size:13px;color:#EDEFEA;">
        <span>${escapeHtml(CPROFILE?.full_name || SESSION.user.email)}</span>
        ${!CPROFILE ? `<button class="btn btn-outline" style="background:#fff;" onclick="openProfileModal()">Lengkapi Profil</button>` : ''}
        <button class="btn btn-ghost" onclick="doLogout()">Keluar</button>
      </div>`;
  } else {
    el('topbar-actions').innerHTML = `
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" onclick="openAuthModal('login')">Masuk</button>
        <button class="btn btn-primary" onclick="openAuthModal('signup')">Daftar</button>
      </div>`;
  }
}

function renderJobs(){
  el('jobs-area').innerHTML = JOBS.map(j=>{
    const myApp = MY_APPS.find(a=>a.job_posting_id===j.id);
    let action;
    if(myApp){
      action = `<span class="badge badge-applied">Sudah Melamar — ${STAGE_LABEL[myApp.stage]||myApp.stage}</span>`;
    } else if(!SESSION){
      action = `<button class="btn btn-primary" onclick="openAuthModal('login')">Lamar</button>`;
    } else if(!CPROFILE){
      action = `<button class="btn btn-primary" onclick="openProfileModal()">Lengkapi Profil untuk Melamar</button>`;
    } else {
      action = `<button class="btn btn-primary" onclick="applyJob('${j.id}')">Lamar Sekarang</button>`;
    }
    return `<div class="card job-card">
        <div style="flex:1;min-width:220px;">
          <div class="job-title">${escapeHtml(j.title)}</div>
          <div class="job-dept">${escapeHtml(j.departments?.name || 'Umum')}</div>
          <div class="job-desc">${escapeHtml(j.description||'')}</div>
        </div>
        <div>${action}</div>
      </div>`;
  }).join('') || '<div class="empty-state">Belum ada lowongan yang dibuka saat ini. Silakan cek kembali nanti.</div>';
}

function renderMyApps(){
  if(!SESSION || !MY_APPS.length){ el('myapps-area').innerHTML = ''; return; }
  el('myapps-area').innerHTML = `
    <h2 style="font-size:16.5px;margin:28px 0 10px;">Lamaran Saya</h2>
    <div class="card" style="padding:0;">
      <table>
        <thead><tr><th>Posisi</th><th>Tanggal Lamar</th><th>Tahap</th></tr></thead>
        <tbody>${MY_APPS.map(a=>`<tr>
            <td>${escapeHtml(a.job_postings?.title||'-')}</td>
            <td>${fmtDate(a.applied_at)}</td>
            <td><span class="badge badge-stage">${STAGE_LABEL[a.stage]||a.stage}</span></td>
          </tr>`).join('')}</tbody>
      </table>
    </div>`;
}

// ---- Autentikasi pelamar ----
function openAuthModal(mode){
  openModal(`
    <h3 style="margin-bottom:16px;">${mode==='login' ? 'Masuk' : 'Daftar Akun Pelamar'}</h3>
    <div class="error-text" id="auth-error"></div>
    <div class="field"><label>Email</label><input id="auth-email" type="email"></div>
    <div class="field"><label>Kata Sandi</label><input id="auth-password" type="password"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="${mode==='login' ? 'doLogin()' : 'doSignup()'}">${mode==='login' ? 'Masuk' : 'Daftar'}</button>
    </div>
    <p style="text-align:center;font-size:12.5px;color:var(--text-muted);margin-top:14px;cursor:pointer;" onclick="openAuthModal('${mode==='login' ? 'signup' : 'login'}')">
      ${mode==='login' ? 'Belum punya akun? Daftar di sini' : 'Sudah punya akun? Masuk'}
    </p>`);
}
function showAuthError(msg){ const e = el('auth-error'); e.textContent = msg; e.style.display = 'block'; }
async function doLogin(){
  const email = el('auth-email').value.trim(), password = el('auth-password').value;
  if(!email || !password){ showAuthError('Lengkapi email dan kata sandi.'); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ showAuthError(error.message); return; }
  closeModal(); showToast('Berhasil masuk.'); loadAll();
}
async function doSignup(){
  const email = el('auth-email').value.trim(), password = el('auth-password').value;
  if(!email || !password){ showAuthError('Lengkapi email dan kata sandi.'); return; }
  if(password.length < 6){ showAuthError('Kata sandi minimal 6 karakter.'); return; }
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){ showAuthError(error.message); return; }
  closeModal();
  if(data.session){ SESSION = data.session; showToast('Akun berhasil dibuat.'); openProfileModal(); loadAll(); }
  else showToast('Akun dibuat. Silakan cek email untuk verifikasi, lalu masuk.');
}
async function doLogout(){ await sb.auth.signOut(); showToast('Berhasil keluar.'); loadAll(); }

// ---- Data diri pelamar ----
function openProfileModal(){
  openModal(`
    <h3 style="margin-bottom:16px;">Lengkapi Data Diri</h3>
    <div class="error-text" id="profile-error"></div>
    <div class="field"><label>Nama Lengkap</label><input id="pf-name" value="${CPROFILE?escapeHtml(CPROFILE.full_name):''}"></div>
    <div class="field"><label>No. Telepon</label><input id="pf-phone" value="${CPROFILE?escapeHtml(CPROFILE.phone||''):''}"></div>
    <div class="field"><label>Link CV / Portofolio (opsional)</label><input id="pf-resume" placeholder="https://..." value="${CPROFILE?escapeHtml(CPROFILE.resume_url||''):''}"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="saveProfile()">Simpan</button>
    </div>`);
}
async function saveProfile(){
  const full_name = el('pf-name').value.trim();
  const phone = el('pf-phone').value.trim();
  const resume_url = el('pf-resume').value.trim();
  if(!full_name || !phone){
    const e = el('profile-error'); e.textContent = 'Nama dan nomor telepon wajib diisi.'; e.style.display = 'block'; return;
  }
  const { error } = await sb.from('candidate_profiles').upsert({
    id: SESSION.user.id, full_name, phone, resume_url: resume_url || null, email: SESSION.user.email
  });
  if(error){ const e = el('profile-error'); e.textContent = error.message; e.style.display = 'block'; return; }
  closeModal(); showToast('Profil disimpan.'); await loadAll();
}

// ---- Melamar ----
async function applyJob(jobId){
  if(!SESSION || !CPROFILE) return;
  const { error } = await sb.from('candidates').insert({
    job_posting_id: jobId, applicant_id: SESSION.user.id,
    full_name: CPROFILE.full_name, email: CPROFILE.email || SESSION.user.email, phone: CPROFILE.phone,
    stage: 'applied'
  });
  if(error){ showToast('Gagal mengirim lamaran: '+error.message, true); return; }
  showToast('Lamaran terkirim! Terima kasih sudah melamar.'); await loadAll();
}

init();
</script>
</body>
</html>
